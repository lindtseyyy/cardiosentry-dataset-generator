# CardioSentry model descriptor — round-2 dual-resolution hybrid (384+768).
schema_version: 1

id: resnet50_dual
display_name: "CardioSentry ResNet-50 dual-stream 384+768 (hybrid_v1)"
version: hybrid_v1
notes: "Headline hybrid: global 384 view + 768 detail view. Both views derive
        from ONE decode of the stored 768 model_input.png, exactly as training."

weights: weights/resnet50_dual.pt
expected_sha256: 0af8b77c9243c2495653608cf9a3d0a4956e88d8c62e8a248cebefc7f7d8e67c
expected_protocol_fingerprint: 36988c5e0ba5d72d

architecture:
  module: arch.hybrids_v1
  registry_key: resnet50_dual
  pretrained: false
  call_style: view_dict
  views: [384, 768]

labels: [STEMI, AF, LVH, NORMAL]
display_names:
  STEMI: "ST-Elevation MI (STEMI)"
  AF: "Atrial Fibrillation"
  LVH: "Left Ventricular Hypertrophy"
  NORMAL: "Normal"

thresholds:
  source: checkpoint               # [0.07, 0.81, 0.93, 0.91]
  explicit: null

preprocess:
  canvas: [1650, 1275]
  margin_px: 18
  input_size: 768
  resample: pil_bicubic
  match_training_jpeg: true
  jpeg_quality: 95
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

runtime:
  device: cpu
  dtype: float32
  num_threads: null           # null = settings.num_threads (env-overridable)

explain:
  enabled: true
  target_layer: null               # auto: the last 4-D feature map (see explain.py)
  # The printed ID/Age/Sex block, as (x0, y0, x1, y1) fractions. Nothing is
  # painted over it — this is the region attribution maps are MEASURED against.
  header_box: [0.10, 0.02, 0.30, 0.18]
  # False: this round trained on unredacted sheets, so the header is in
  # distribution for it. That makes header attribution less surprising and no
  # less disqualifying — the record ID printed there separates STEMI exactly.
  header_redacted_in_training: false
