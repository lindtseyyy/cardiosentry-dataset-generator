# CardioSentry model descriptor — round-1 ResNet-50 @384 (tensor call style).
# Included to exercise the F3 adapter: round-1 models take a plain tensor.
schema_version: 1

id: resnet50_v1
display_name: "CardioSentry ResNet-50 @384 (round 1)"
version: runs_v1
notes: "Round-1 single-stream model at 384px. Its views derive from the stored
        768 model_input.png by one BICUBIC step down (same as the round-2
        training loader derived the 384 view)."

weights: weights/resnet50_v1.pt
expected_sha256: 4dd4a59f40fe55375ee1fa19e217d9373c14174fb05adde512afc4d187864eea
expected_protocol_fingerprint: 936b42d988015ade

architecture:
  module: arch.runs_v1
  registry_key: resnet50
  pretrained: false
  call_style: tensor              # round-1 models take model(tensor) (F3)
  views: [384]

labels: [STEMI, AF, LVH, NORMAL]
display_names:
  STEMI: "ST-Elevation MI (STEMI)"
  AF: "Atrial Fibrillation"
  LVH: "Left Ventricular Hypertrophy"
  NORMAL: "Normal"

thresholds:
  source: checkpoint               # [0.33, 0.88, 0.70, 0.71]
  explicit: null

preprocess:
  canvas: [1650, 1275]
  margin_px: 18
  input_size: 768                 # stored model_input.png size (shared by all)
  resample: pil_bicubic
  match_training_jpeg: true
  jpeg_quality: 95
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

runtime:
  device: cpu
  dtype: float32
  num_threads: null           # null = settings.num_threads (env-overridable)

explain:
  enabled: true
  target_layer: null               # auto: the last 4-D feature map (see explain.py)
  # The printed ID/Age/Sex block, as (x0, y0, x1, y1) fractions. Nothing is
  # painted over it — this is the region attribution maps are MEASURED against.
  header_box: [0.10, 0.02, 0.30, 0.18]
  # False: this round trained on unredacted sheets, so the header is in
  # distribution for it. That makes header attribution less surprising and no
  # less disqualifying — the record ID printed there separates STEMI exactly.
  header_redacted_in_training: false
