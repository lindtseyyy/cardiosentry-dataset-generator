[project]
name = "cardiosentry-application"
version = "0.1.0"
description = "Image-space multi-label ECG-sheet classifier — research instrument for real-photo validation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    # OpenCV 4 vs 5: cv2.HoughLinesP returns (N,1,4) vs (N,4) — detect.py
    # normalizes both (tests/test_detect.py::test_hough_lines_shape_normalization).
    "opencv-python-headless>=4.9,<6",
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm==1.0.28",          # pinned: backbone tag semantics drift across versions (§4.1, Q12)
    "qrcode[pil]>=7.4",
    "piexif>=1.1",           # surgical GPS-EXIF removal without pixel re-encode (§13.4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",           # TestClient transport
]

[project.scripts]
cardiosentry = "backend.main:main"
cardiosentry-verify = "scripts.verify_model:main"
cardiosentry-reprocess = "scripts.reprocess:main"
cardiosentry-export = "scripts.export_dataset:main"

[tool.setuptools]
packages = { find = { include = ["backend*"] } }
